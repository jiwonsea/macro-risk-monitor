pe_secondary_discount_pct:
  value: null            # percent. NAV 대비 → 항상 음수
  as_of: 2026-05-27
  source_url: https://www.jefferies.com/our-firm/news-and-research/
  note: |
    Source: Jefferies H1/H2 Global Secondary Market Review (PDF), Lazard 분기 노트
    부호 규칙: NAV 대비 디스카운트 = 음수 (예: -13.0이면 87% NAV)
    Cadence: 반기 (1월·7월 PDF 공개)
    Threshold: red <= -20, yellow <= -13, green >= -8 (numeric, 자동 평가)
    Codex 2026-05-27 threshold 완화 — Jefferies 2025 평균 ~-13% 대비 기존 red <= -25는
    cherry-pick 위험.

