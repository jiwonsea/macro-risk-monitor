openai_implied_valuation_discount_pct:
  value: null            # percent. 디스카운트면 음수, 프리미엄이면 양수
  as_of: 2026-05-27
  source_url: https://www.hiive.com/companies/openai
  note: |
    Source: Hiive/Forge/Prism/Premier 헤드라인 indicative price → implied valuation
            구하고, 직전 primary/tender valuation 대비 ((current - last) / last) * 100
    부호 규칙: 디스카운트=음수, 프리미엄=양수
    Cadence: 월 1회
    Threshold: red <= -10, yellow <= -5, green >= 10 (numeric, 자동 평가)
    회피: share-class premium 직접 계산 (bid/ask·reference 일관성 부족)
    2026-05-31 소스 탐색 (값 미입력 — 데이터 비수렴):
      직전 primary: 2026-03 $122B 라운드, post-money $852B.
      가장 깨끗한 secondary implied valuation: Forge Global ~$880B (2026-04-24)
        → +3.3% 프리미엄 (디스카운트 아님). green 임계(>= 10) 미달, 어느 밴드에도 안 걸림.
      소스 비수렴: WSJ $6.6B 세컨더리 ~$400B(Oct'25 텐더 재보도, stale),
        tokenized SPV(PreStocks) 최대 $1.5T(자산 $23M, 무효), per-share도 분산
        (Nasdaq PM $663.95 5/14 · Hiive $695 5/29 · Forge $733 5/30).
      이 비수렴이 note의 "bid/ask·reference 일관성 부족" 회피 사유의 실증.
      2026-05-13 SPV transfer 무효 사건이 토큰 implied·per-share 레퍼런스를 오염.
      결론: 단일 신뢰값 없음 → value=null 유지. 향후 Forge/Caplight 헤드라인
        implied valuation이 명확히 디스카운트로 전환될 때 입력 (UNVERIFIED).

oracle_bond_spread_5y_zscore:
  value: null            # z-score (rolling 24m)
  as_of: 2026-05-27
  source_url: https://www.finra.org/finra-data/fixed-income
  note: |
    Source: FINRA TRACE에서 ORCL 5Y benchmark bond yield - 매칭 5Y UST yield
    계산: 월별 spread bps 시계열을 24m rolling z-score로 표준화. 사용자가
          매월 1회 직전 24개월 spread 평균·표준편차로 z 계산해서 입력.
    Cadence: 월 1회 (CDS daily는 retail 부담 + Bloomberg 의존)
    Threshold: red > 2 (2σ widening), yellow > 1, green < 0.5
    Codex 2026-05-27 REPLACE — 기존 oracle_cds_5y > 139bps는 cherry-pick 위험 +
    Bloomberg paid_institutional 의존.
    2026-05-31 소스 탐색: 라이브 spread는 TradingView ORCL 채권
      (https://www.tradingview.com/symbols/NYSE-ORCL/bonds/)에서 무료 확인 가능.
      현재 스냅샷: 4.5% '28 +64.7bps, 6.15% '29 +94.8bps (2026-05 중순).
      z-score는 24개월 월별 spread 이력이 필요 → 단일 스냅샷으로 계산 불가.
      Phase 2: ORCL 5Y 벤치마크 본드 하나 골라 월별 yield−DGS5(FRED) 누적 저장 후 z 계산.
      그 전까지 value=null 유지 (사용자 월 1회 입력 또는 시계열 소스 구축 대기).

dram_spot_ddr5_mom_pct:
  value: null            # percent (MoM 단월) — 정밀 MoM은 4월 월평균 기준선 필요
  as_of: 2026-05-29
  source_url: https://www.trendforce.com/price/dram/dram_spot
  note: |
    Source: TrendForce DRAM spot 페이지 (DRAMeXchange 데이터, 무료/로그인 불필요).
            DDR5 16Gb chip Session Average의 월 평균 MoM % 변화.
    Cadence: 매월 말일
    Threshold: red <= -5 (numeric, 자동 평가), yellow <= -2, green >= 0
    "2개월 연속 하락"은 사용자가 직접 추세 메모 — note에 직전 1~2개월 MoM 값 같이
    적어두면 LLM이 narrative에서 추세 해석 가능.
    Codex 2026-05-27: category lagging → coincident 재분류 (AI/HBM 수요 신호와 직접 연결).
    2026-05-31 소스 탐색: dramexchange.com(페이월) → TrendForce spot 페이지로 교체.
      현재 스냅샷 DDR5 16Gb chip = $41.90 (2026-05-29, 일간 +0.16%).
      TrendForce 5월 보도자료 다수: DDR5 spot 상승 기조(증가폭 둔화) → MoM 방향 GREEN(>=0)
      유력. 단 정밀 MoM%는 4월 월평균이 있어야 계산 가능 — value는 사용자/다음 사이클 입력.

