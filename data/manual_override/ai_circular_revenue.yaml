  note: |
    Source: NVDA 10-K/10-Q customer concentration disclosure 섹션. 보통 "one customer
            accounted for approximately X% of total revenue" 형태로 기재.
    Cadence: 분기 (10-Q 공시 시점)
    Threshold: red >= 25, yellow >= 15, green < 10 (numeric, 자동 평가)
    Codex 2026-05-27 신규 추가 — circular revenue 가설의 missing dimension 보완.
    소수 고객 집중도 상승 = vendor financing/related-party 리스크의 직접 signal.
    2026-05-31 fill (10-Q FY27 Q1, period end 2026-04-26, filed 2026-05-20):
      "three direct customers represented 21%, 17%, and 16% of total revenue" →
      top-1 direct customer = 21% → YELLOW. (간접고객 중 일부도 개별 10%+ 공시.)

