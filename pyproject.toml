[project]
name = "macro-risk-monitor"
version = "0.1.0"
description = "거시 리스크 가설/ad-hoc 입력을 받아 데이터·뉴스 기반 트리거 모니터링 리포트를 자동 생성하는 파이프라인"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.32,<3",
    "jinja2>=3.1,<4",
    "markdown>=3.5,<4",
    "ruamel.yaml>=0.18,<1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.30,<1"]
sources = [
    "yfinance>=0.2.40,<1",
    "beautifulsoup4>=4.12,<5",
]
charts = ["matplotlib>=3.8,<4"]
ui = ["streamlit>=1.37,<2", "plotly>=5.18,<6"]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<7", "ruff>=0.4,<1"]

[tool.setuptools]
packages = [
    "macro_risk_monitor",
    "macro_risk_monitor.sources",
    "macro_risk_monitor.engine",
    "macro_risk_monitor.ai",
    "macro_risk_monitor.output",
    "macro_risk_monitor.pipeline",
]

[tool.setuptools.package-data]
macro_risk_monitor = ["templates/*.j2", "static/*.css", "static/*.json"]

[project.scripts]
macro-risk = "macro_risk_monitor.cli:main"

[tool.ruff]
line-length = 100
exclude = [".cache", "reports", "logs"]

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
