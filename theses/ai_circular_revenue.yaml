name: ai_circular_revenue
title: AI 밸류체인 closed-loop revenue 가설
created: 2026-05-26
hypothesis: |
  하단(메모리: Micron·SK하이닉스·Samsung) - 중간(NVIDIA) - 상단(OpenAI·Oracle·MS)
  사이의 다년 LTA·equity 투자·compute commitment가 외부 end demand의 검증보다 빠르게
  매출로 인식되며 valuation에 반영되고 있다. 검증 시점(OpenAI 차기 펀딩 또는
  hyperscaler capex 가이던스)이 가격 inflection의 분기점이 될 수 있다.

historical_analogy:
  - 1999 Cisco vendor financing
  - 2000 Lucent-Nortel
  - Greenwood-Hanson (2013) issuer-quality 후기 국면

triggers:
  - id: openai_implied_valuation_discount
    category: leading
    source: manual_override
    series: openai_implied_valuation_discount_pct
    unit: percent
    description: |
      OpenAI implied valuation (Prism·Premier·Hiive·Forge 헤드라인 indicative price 기반)
      대비 직전 primary/tender valuation 디스카운트. 부호: 디스카운트=음수, 프리미엄=양수.
      share-class premium 직접 계산은 회피 (bid/ask·reference 일관성 부족).
    threshold:
      red: "<= -10"
      yellow: "<= -5"
      green: ">= 10"

  - id: oracle_bond_spread_5y
    category: leading
    source: manual_override
    series: oracle_bond_spread_5y_zscore
    unit: zscore
    description: |
      ORCL 5Y benchmark bond yield − 매칭 5Y UST yield의 rolling z-score (24m window).
      raw bps 대신 z-score 사용 — 절대 spike(예: 139bps)는 cherry-pick 위험.
      retail source: FINRA TRACE 또는 Yahoo Finance bond yield.
    threshold:
      red: "> 2"          # 2σ 이상 widening
      yellow: "> 1"
      green: "< 0.5"

  - id: circular_revenue_press_attention
    category: leading
    source: news_rss
    series: "circular revenue, vendor financing, round-trip deal, related-party revenue, vendor-financed"
    unit: count
    description: |
      금융 뉴스 플로우(Bloomberg·Reuters·CNBC RSS)에서 최근 30일(NEWS_RSS_LOOKBACK_DAYS)
      circular-revenue 관련 키워드 매칭 기사 건수. 가설이 시장 내러티브로 표면화되는
      시점을 잡는 leading signal — 정량 트리거(밸류에이션·스프레드)보다 먼저 움직일 수 있다.
      manual_override가 아닌 live 네트워크 소스 (registry → NewsRssSource, .cache/news_rss 캐시).
      UNVERIFIED 임계치 — 실제 피드 baseline 분포로 percentile 재보정 필요. 현재 값은
      "평상시 대비 비정상적 보도 급증"을 잡기 위한 placeholder.
    threshold:
      red: ">= 8"
      yellow: ">= 4"
      green: "< 2"

  - id: hyperscaler_capex_tone
    category: coincident
    source: earnings_transcript_nlp
    series: capex_efficiency_terms
    description: MS·GOOGL·META·AMZN earnings call에서 'rationalize'·'efficiency'·'discipline' 어휘 등장 빈도
    threshold:
      red: "2개사 동시 'rationalize' OR 'efficiency'"
      yellow: "1개사"
      green: "0개사 (compute-constrained 유지)"

  - id: dram_spot_price_mom
    category: coincident
    source: manual_override
    series: dram_spot_ddr5_mom_pct
    unit: percent
    description: |
      DRAMeXchange DDR5 16Gb 월 평균 스팟 가격의 MoM % 변화.
      "2개월 연속 하락"은 사용자가 직접 추세 메모(value=단월 MoM, note=직전 월값).
      AI/HBM 수요 신호와 직접 연결 → coincident로 재분류 (Codex 2026-05-27).
    threshold:
      red: "<= -5"        # MoM -5% 이상 급락
      yellow: "<= -2"
      green: ">= 0"

  - id: nvda_customer_concentration
    category: coincident
    source: manual_override
    series: nvda_top_customer_revenue_pct
    unit: percent
    description: |
      NVIDIA 10-K/10-Q customer concentration disclosure에서 top-1 customer가
      총 매출에서 차지하는 비중. circular revenue 가설의 핵심 지표 — 소수 고객
      집중도 상승은 vendor financing/related-party 리스크의 직접 signal.
      Codex 2026-05-27 권고로 신규 추가 (가설의 missing dimension 보완).
    threshold:
      red: ">= 25"
      yellow: ">= 15"
      green: "< 10"

  - id: nvda_data_center_qoq
    category: lagging
    source: manual_override
    series: nvda_dc_segment_revenue_qoq_pct
    unit: percent
    description: NVIDIA Data Center 부문 매출 QoQ 성장률 (10-Q segment 기준)
    threshold:
      red: "<= 0"
      yellow: "<= 5"
      green: "> 10"

decision_rule: rule_of_three

critical_windows:
  - date: 2026-05-28
    event: NVDA FY27 Q1
    rationale: Data-center revenue and customer concentration can confirm or weaken circular demand.
  - date: 2026-06-01
    event: ORCL FY26 Q4
    rationale: Oracle financing, backlog, and capex commentary are central to AI commitment quality.
  - date: 2026-07-25
    event: MSFT / GOOGL / META / AMZN earnings window
    rationale: Hyperscaler capex discipline can reveal whether AI demand is broad or vendor-driven.
  - date: 2026-08-28
    event: NVDA FY27 Q2
    rationale: Sequential data-center growth and disclosure quality are lagging confirmation points.

notes: |
  사용자와 Claude의 5/16~5/18 대화를 그대로 인코딩한 검증용 첫 가설.
  manual_override에 OpenAI valuation·Oracle bond spread·DRAM MoM·NVDA customer
  concentration·NVDA Data Center QoQ를 사용자가 입력. hyperscaler 어휘는 Phase 2
  NLP 모듈에서 자동화.
  2026-05-31: nvda_data_center_qoq를 sec_edgar → manual_override로 정정 (세그먼트
  매출은 companyfacts XBRL에 표준 concept 부재 — sec_edgar.py docstring 참조).

  2026-05-27 Codex review 반영:
  - openai_secondary_premium → openai_implied_valuation_discount (series 재정의)
  - oracle_cds_5y → oracle_bond_spread_5y (z-score, retail-accessible)
  - dram_spot_price → dram_spot_price_mom (numeric, coincident로 재분류)
  - nvda_customer_concentration 신규 추가 (가설의 missing dimension — 트리거 6개)

  2026-06-29: circular_revenue_press_attention(news_rss) 신규 추가 — 트리거 7개.
  news_rss 소스를 실제 가설에 처음 연결. live 네트워크 의존(manual_override 아님);
  임계치는 UNVERIFIED placeholder로 baseline 분포 재보정 필요.
