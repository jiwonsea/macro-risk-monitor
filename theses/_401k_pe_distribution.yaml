name: _401k_pe_distribution
title: 401K 대체자산 개방을 통한 PE retail distribution 가설
created: 2026-05-26
hypothesis: |
  PE의 전통 exit 채널(IPO·M&A·dividend recap·secondary)이 고금리로 동시에 좁아진
  국면에서, 401K(약 $12T)의 PE·crypto 편입 허용은 우연이 아니라 마지막 marginal
  buyer로의 정치적 동원이다. NDX·CRSP fast entry 룰 + float weighting 변경은
  pre-IPO holder의 자연스러운 카운터파티를 인덱스 펀드로 만든다.

historical_analogy:
  - 1980s S&L 디레귤레이션 + LP 세제혜택 상품
  - 1999~2000 IPO spinning·laddering
  - Greenwood-Hanson issuer-quality cycle 후기

triggers:
  - id: dol_safe_harbor_rule
    category: leading
    source: manual_override
    series: dol_pe_safe_harbor_status
    description: DOL의 401K PE safe harbor 규칙 진행도 (proposed/final/effective)
    threshold:
      red: final OR effective
      yellow: proposed
      green: not_yet

  - id: pe_secondary_discount
    category: leading
    source: manual_override
    series: pe_secondary_discount_pct
    unit: percent
    description: |
      Jefferies·Lazard secondary market 평균 LP portfolio 디스카운트 (NAV 대비).
      Codex 2026-05-27 threshold 완화 — 기존 red <= -25는 Jefferies 2025 평균
      ~87% NAV (= -13%) 대비 너무 극단적, cherry-pick 위험.
    threshold:
      red: "<= -20"
      yellow: "<= -13"
      green: ">= -8"

  - id: ndx_fast_entry_additions
    category: coincident
    source: manual_override
    series: ndx_fast_entry_count_ttm
    description: |
      NDX fast-entry 룰로 5거래일 내 편입된 qualifying IPO 건수 (TTM).
      Codex 2026-05-27 threshold 완화 — mega-cap IPO 희소성 감안, 기존
      red >= 5는 사실상 trip 불가.
    threshold:
      red: ">= 2"
      yellow: ">= 1"
      green: "0"

  - id: us_ipo_activity
    category: lagging
    source: manual_override
    series: us_ipo_count_ttm
    description: |
      미국 IPO 건수 TTM (Renaissance Capital 또는 StockAnalysis 집계).
      Codex 2026-05-27 REPLACE — 기존 global_ipo_count_ttm은 Renaissance free
      tier가 사실상 US-only, "10년 최저권" qualitative threshold도 모호.
      UNVERIFIED: percentile thresholds는 long-term avg ~150~200 가정 기반,
      사용자가 Renaissance 10y 시계열로 percentile 재보정 필요.
    threshold:
      red: "<= 75"        # rough 10y 1pct (UNVERIFIED)
      yellow: "<= 110"    # rough 10y -1σ
      green: "> 150"

  - id: pe_aggregate_distributions
    category: lagging
    source: manual_override
    series: pe_aggregate_distributions_pct_nav
    unit: percent
    description: |
      Bain Global PE Report 또는 동급 free benchmark의 aggregate distributions
      as % of NAV. Codex 2026-05-27 REPLACE — 기존 pe_dpi_vintage_2020은
      Cambridge/Burgiss paid_institutional 접근 제한, UNVERIFIED 임계치.
      retail-accessible 대안으로 Bain annual report 인용.
      UNVERIFIED: % NAV threshold range는 추정. Bain 보고서로 percentile 보정.
    threshold:
      red: "< 5"
      yellow: "< 8"
      green: ">= 12"

  - id: dc_plan_pe_adoption
    category: coincident
    source: manual_override
    series: dc_plan_pe_adoption_count_ttm
    description: |
      Major recordkeeper(Vanguard·Fidelity·Empower 등)·TDF suite·대형 DC plan에서
      private equity allocation 공식 발표/도입 건수 (TTM).
      Codex 2026-05-27 신규 추가 — 가설의 핵심 missing dimension. safe harbor
      통과만으로는 가설 검증 불가, 실제 capital adoption이 핵심.
    threshold:
      red: ">= 3"
      yellow: ">= 1"
      green: "0"

decision_rule: rule_of_three

critical_windows:
  - date: 2026-03-31
    event: DOL safe harbor rule proposal
    rationale: Regulatory permission is a leading condition for PE access in defined-contribution plans.
  - date: 2026-05-01
    event: NDX fast-entry rule application
    rationale: Index inclusion mechanics affect late-stage private company exit and distribution incentives.
  - date: 2026-04-27
    event: CRSP float-adjusted methodology test
    rationale: Float treatment can change the marginal buyer base for newly public PE-backed issuers.

notes: |
  Phase 1은 manual_override 위주 — DOL·NDX·CRSP 룰 변화는 정성 이벤트가
  많아 자동 fetch 어렵다. Phase 2에서 federalregister.gov API + index
  methodology PDF 자동 파싱으로 격상 가능.

  2026-05-27 Codex review 반영:
  - pe_secondary_discount: threshold 완화 (-25→-20, -15→-13, -10→-8)
  - ndx_fast_entry_additions: threshold 완화 (5→2, 2→1)
  - ipo_count_global → us_ipo_activity (Renaissance US-only, numeric percentile)
  - pe_dpi_vintage_2020 → pe_aggregate_distributions (Bain retail-accessible)
  - dc_plan_pe_adoption 신규 추가 (가설 핵심 missing dimension — 트리거 6개)
  UNVERIFIED 임계치(us_ipo_activity, pe_aggregate_distributions)는 사용자가
  실제 historical 시계열로 percentile 재보정 필요.
