name: kr_us_tightening_spillover
title: 한·미 동반 긴축기 장기금리 동조화와 국내 spillover 가설
created: 2026-10-05
hypothesis: |
  연준(2026-09 인상, 상단 4.00%)과 한국은행(2026-07·08 연속 인상, 3.00%)이 함께 긴축하는 국면에서
  미국 장기금리(10년물 5%대)가 한 단계 더 오르면, 한·미 장기금리 동조화를 통해 국고채 금리가 따라 오르고
  한·미 금리차 확대 → 원/달러 상승 → 국내 크레딧 스프레드 확대 순으로 국내 자금시장에 전이된다.
  다만 2024년 이후 국고채의 미 금리 민감도가 낮아졌다면, 전이는 금리보다 환율·크레딧 경로로 나타날 수 있다.

historical_analogy:
  - 2018 연준 인상기 한·미 금리 역전
  - 2022 글로벌 인플레이션 충격과 레고랜드 사태(크레딧 경색)

triggers:
  - id: ust_10y_yield
    category: leading
    source: fred
    series: DGS10
    unit: percent
    description: 미국 10년물 국채 수익률 (FRED DGS10, 일간)
    threshold:
      red: ">= 5.0"
      yellow: ">= 4.6"
      green: "< 4.6"

  - id: us_kr_policy_gap
    category: leading
    source: derived
    series: "fred:DFEDTARU - ecos:722Y001/M/0101000"
    unit: percentage_points
    description: 연준 목표금리 상단 − 한국은행 기준금리 (%p)
    threshold:
      red: ">= 2.0"
      yellow: ">= 1.5"
      green: "< 1.5"

  - id: ktb_ust_10y_gap
    category: coincident
    source: derived
    series: "ecos:817Y002/D/010210000 - fred:DGS10"
    unit: percentage_points
    description: 국고채 10년 − 미 국채 10년 (%p, 음수 = 한국 금리가 낮음)
    threshold:
      red: "<= -1.0"
      yellow: "<= -0.6"
      green: "> -0.6"

  - id: usdkrw
    category: coincident
    source: ecos
    series: 731Y001/D/0000001
    unit: 원
    description: 원/달러 매매기준율 (ECOS 731Y001, 일별)
    threshold:
      red: ">= 1480"
      yellow: ">= 1450"
      green: "< 1450"

  - id: kr_credit_spread
    category: lagging
    source: derived
    series: "ecos:817Y002/D/010300000 - ecos:817Y002/D/010200000"
    unit: percentage_points
    description: 회사채 3년 AA- − 국고채 3년 (%p, ECOS 817Y002)
    threshold:
      red: ">= 1.0"
      yellow: ">= 0.75"
      green: "< 0.75"

  - id: vix
    category: coincident
    source: fred
    series: VIXCLS
    unit: index
    description: CBOE VIX (FRED VIXCLS)
    threshold:
      red: ">= 25"
      yellow: ">= 20"
      green: "< 20"

decision_rule: rule_of_three

critical_windows:
  - date: 2026-10-28
    event: FOMC (10/27~28)
    rationale: 연말 정책금리 경로가 미 장기금리와 한·미 정책금리차를 다시 정한다.

notes: |
  임계치는 2016-10~2026-09 분포(분위수)와 2018·2022 국면을 기준으로 잡고, 2026-10-05 Codex 리뷰를 반영했다
  (정책금리차 1.5/2.0, 원/달러 1,450/1,480 상향, VIX는 글로벌 동시 스트레스로 보고 coincident로 이동).
  사전 운용안이며 백테스트로 검증한 값이 아니다.
  FOMC 일정은 federalreserve.gov 2026-10 캘린더로 확인. 한국은행 금통위는 공식 일정 확인 후 추가.
