name: us_long_end_yield
title: 미국 장기국채 수익률 상승의 capital market spillover 가설
created: 2026-05-26
hypothesis: |
  이란 갈등 장기화에 따른 유가·인플레이션 압력 + 영국 길트 spillover로
  US 10Y 4.5%, 30Y 5%대가 정착하면, 모기지·IG 회사채 spillover로 가계·기업
  자본 조달 비용이 상승해 자본시장 전반에 유동성 제약·하방 압력이 작용한다.
  Term premium 재가격이 본질이며 지정학·정치 이벤트는 catalyst.

historical_analogy:
  - 1994 채권 발작
  - 2013 Taper tantrum
  - 2022 UK gilt 위기 (LDI 강제 매도)

triggers:
  - id: ust_10y_yield
    category: leading
    source: fred
    series: DGS10
    unit: percent
    description: 10년 만기 미국 국채 수익률 (FRED DGS10, 일간)
    threshold:
      red: ">= 4.5"
      yellow: ">= 4.2"
      green: "< 4.0"

  - id: ust_30y_yield
    category: leading
    source: fred
    series: DGS30
    unit: percent
    description: 30년 만기 미국 국채 수익률 (FRED DGS30, 일간)
    threshold:
      red: ">= 5.0"
      yellow: ">= 4.7"
      green: "< 4.5"

  - id: mortgage_30y_rate
    category: coincident
    source: fred
    series: MORTGAGE30US
    unit: percent
    description: 30년 고정 모기지 금리 (FRED MORTGAGE30US, 주간)
    threshold:
      red: ">= 7.5"
      yellow: ">= 7.0"
      green: "< 6.5"

  - id: ig_corp_spread
    category: coincident
    source: fred
    series: BAMLC0A0CM
    unit: bps
    description: ICE BofA US Corporate Index OAS (FRED BAMLC0A0CM)
    threshold:
      red: ">= 150"
      yellow: ">= 120"
      green: "< 100"

  - id: vix
    category: lagging
    source: fred
    series: VIXCLS
    unit: index
    description: CBOE VIX volatility index (FRED VIXCLS)
    threshold:
      red: ">= 25"
      yellow: ">= 20"
      green: "< 18"

decision_rule: rule_of_three

critical_windows:
  - date: 2026-06-12
    event: FOMC
    rationale: Policy guidance can reset term-premium and duration-risk pricing.
  - date: 2026-07-30
    event: FOMC
    rationale: Follow-through meeting for inflation, issuance, and long-end yield pressure.
  - date: 2026-08-15
    event: Treasury refunding announcement
    rationale: Coupon issuance mix can directly affect long-end supply and spillover risk.

notes: |
  이 가설은 FRED 무료 소스만으로 5개 트리거 자동 평가 가능 —
  Phase 1 end-to-end 검증의 가장 좋은 후보이며 첫 ad-hoc 모드 출력과
  비교 기준선으로도 활용한다.
