name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev/optional extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,sources,charts,dev]"

      # No ANTHROPIC_API_KEY / FRED_API_KEY in CI: the suite is mock-only and
      # exercises the SourceUnavailable / graceful-degrade paths instead.
      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest
