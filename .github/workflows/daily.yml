name: Daily report

# Regenerates the static HTML reports and publishes them to GitHub Pages.
# Runs on a daily schedule and on demand. When ANTHROPIC_API_KEY / FRED_API_KEY
# are absent (e.g. a fork without secrets) the pipeline degrades gracefully:
# analyze() falls back to a deterministic stub and unavailable sources resolve
# to UNKNOWN, so a report still builds and deploys.

on:
  schedule:
    # 13:00 UTC daily (~22:00 KST), after US market close.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Allow the workflow to read the repo and publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,sources,charts]"

      - name: Generate reports into docs/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # PDF is skipped: Chrome is not installed on the runner and
          # output/pdf.py returns None / no-ops in that case.
          for thesis in theses/*.yaml; do
            name="$(basename "$thesis" .yaml)"
            echo "::group::$name"
            macro-risk run "$thesis" --output "docs/$name.html"
            echo "::endgroup::"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
