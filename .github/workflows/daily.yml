name: Daily report

# Regenerates the static HTML reports and publishes them to GitHub Pages.
# Runs on a daily schedule and on demand. When ANTHROPIC_API_KEY / FRED_API_KEY
# are absent (e.g. a fork without secrets) the pipeline degrades gracefully:
# analyze() falls back to a deterministic stub and unavailable sources resolve
# to UNKNOWN, so a report still builds and deploys.

on:
  schedule:
    # 13:00 UTC daily (~22:00 KST), after US market close.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Allow the workflow to read the repo and publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deployment at a time; don't cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,sources,charts]"

      - name: Generate reports into docs/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # PDF is skipped: Chrome is not installed on the runner and
          # output/pdf.py returns None / no-ops in that case.
          # One thesis failing must not block the others from deploying;
          # fail the job only when *every* thesis failed.
          ok=0; failed=0
          : > "$RUNNER_TEMP/summary.txt"
          for thesis in theses/*.yaml; do
            name="$(basename "$thesis" .yaml)"
            echo "::group::$name"
            if macro-risk run "$thesis" --output "docs/$name.html" > /tmp/run.log 2>&1; then
              cat /tmp/run.log
              ok=$((ok+1))
              action="$(grep -m1 '^action: ' /tmp/run.log | cut -d' ' -f2- || true)"
              echo "$name: ${action:-unknown}" >> "$RUNNER_TEMP/summary.txt"
            else
              cat /tmp/run.log
              echo "::warning::thesis $name failed; keeping previously committed HTML if any"
              failed=$((failed+1))
              echo "$name: FAILED" >> "$RUNNER_TEMP/summary.txt"
            fi
            echo "::endgroup::"
          done
          echo "reports ok=$ok failed=$failed"
          if [ "$ok" -eq 0 ]; then
            echo "::error::all theses failed"
            exit 1
          fi

      # Optional Slack notification — configure the SLACK_WEBHOOK_URL secret
      # (Slack incoming webhook) to receive the per-thesis action summary.
      # Skipped silently when the secret is absent; a notify failure never
      # fails the build.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping notification"
            exit 0
          fi
          summary="$(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo 'no summary produced')"
          text="$(printf 'macro-risk daily report\n%s' "$summary")"
          payload="$(jq -n --arg text "$text" '{text: $text}')"
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
